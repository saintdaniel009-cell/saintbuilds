.arrows{display:none;gap:10px}
@media(min-width:760px){.arrows{display:flex}}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center}
.arrows button:disabled{opacity:.35;cursor:default}
.arrows svg{width:18px;height:18px}
.track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(20px,calc((100vw - 1200px)/2));scroll-behavior:smooth;scrollbar-width:none;padding:8px max(20px,calc((100vw - 1200px)/2)) 24px;margin:0 calc(50% - 50vw)}
.track::-webkit-scrollbar{display:none}
.card{flex:none;scroll-snap-align:center}
@media(min-width:760px){.card{scroll-snap-align:start}}
.card video{height:clamp(420px,62vh,600px);width:auto;border-radius:24px;background:#000;object-fit:cover;box-shadow:var(--shadow)}
.card b{display:block;font-weight:600;margin-top:16px;letter-spacing:-.02em}
.card span{display:block;color:var(--soft);font-size:15px}
.card video.r169{height:auto;width:min(860px,82vw)}
.r916{aspect-ratio:9/16}.r45{aspect-ratio:4/5}.r169{aspect-ratio:16/9}.rapp{aspect-ratio:720/1558}
.v-more{text-align:center;margin-top:120px}

<script>
/* One video plays at a time; the play button hands over to native controls. */
document.querySelectorAll('.play').forEach(function(b){
  var v=b.previousElementSibling;
  b.addEventListener('click',function(){
    document.querySelectorAll('video').forEach(function(o){if(o!==v)o.pause()});
    v.controls=true;b.hidden=true;v.play();
  });
  v.addEventListener('play',function(){document.querySelectorAll('video').forEach(function(o){if(o!==v)o.pause()})});
});
/* Shelf arrows scroll by one card. */
document.querySelectorAll('.shelf').forEach(function(s){
  var t=s.querySelector('.track'),p=s.querySelector('.bk'),n=s.querySelector('.fw');
  function step(d){var c=t.querySelector('.card');t.scrollBy({left:d*((c?c.offsetWidth:300)+20)})}
  function sync(){p.disabled=t.scrollLeft<4;n.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-4;s.querySelector('.arrows').hidden=p.disabled&&n.disabled}
  p.addEventListener('click',function(){step(-1)});n.addEventListener('click',function(){step(1)});
  t.addEventListener('scroll',sync,{passive:true});addEventListener('resize',sync);sync();
});
</script>
