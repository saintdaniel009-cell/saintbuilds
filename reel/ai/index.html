<style>
:root{--bg:#0C0C0C;--fg:#D7E2EA;--muted:#8F9AA3;--line:rgba(215,226,234,.14);--card:#15171B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'Kanit',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
nav{display:flex;justify-content:space-between;padding:24px 0;font-size:15px}
nav a{color:inherit;text-decoration:none;opacity:.8}
h1{font-size:clamp(36px,7vw,60px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:16px 0 14px;background:linear-gradient(180deg,#646973 0%,#BBCCD7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{font-weight:300;font-size:18px;line-height:1.6;color:#C4CFD7;max-width:640px}
.grid{display:grid;gap:20px;margin:40px 0 56px}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
figure{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
video{display:block;width:100%;height:auto;border-radius:14px;background:#000;margin:0 auto}
.v916 video{max-height:640px;width:auto;max-width:100%}
.v45 video{max-height:560px;width:auto;max-width:100%}
figcaption{margin-top:14px}
figcaption b{display:block;font-weight:500;font-size:18px}
figcaption span{display:block;color:var(--muted);font-weight:300;font-size:15px;line-height:1.5;margin-top:4px}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.links a{border:1px solid var(--line);border-radius:999px;padding:10px 20px;color:inherit;text-decoration:none;font-size:15px}
footer{padding:32px 0 48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/reel/">← Showreel</a><a href="mailto:letsbuild@saintbuilds.com">Contact</a></nav>
  <h1>AI video work</h1>
  <p class="intro">Campaign videos for Rigo, a healthcare-focused bank. I generated the footage with AI tools, then edited, captioned, scored and sound-designed each piece in DaVinci Resolve.</p>
  <div class="links"><a href="/reel/">Main showreel</a><a href="/work/">Product case studies</a></div>
  <div class="grid">
    <figure class="wide"><video src="ai-film.mp4" poster="ai-film.jpg" controls playsinline preload="metadata"></video>
      <figcaption><b>Pharmacy owner, 16:9</b><span>A short cinematic spot following a pharmacist through his day, ending on the Rigo logo.</span></figcaption></figure>
    <figure class="v916"><video src="rigo-vo.mp4" poster="rigo-vo.jpg" controls playsinline preload="metadata"></video>
      <figcaption><b>Why Rigo exists, 9:16</b><span>A voiceover brand story about healthcare businesses across Nigeria, with kinetic captions.</span></figcaption></figure>
    <figure class="v916"><video src="rigo-chat.mp4" poster="rigo-chat.jpg" controls playsinline preload="metadata"></video>
      <figcaption><b>The chat, 9:16</b><span>A financing ad told through a chat thread between two business owners, then a branded end card.</span></figcaption></figure>
    <figure class="v45 wide"><video src="illustrated-story.mp4" poster="illustrated-story.jpg" controls playsinline preload="metadata"></video>
      <figcaption><b>Illustrated story, 4:5</b><span>An illustrated, animated walkthrough of the Rigo business account, in one consistent character style.</span></figcaption></figure>
  </div>
  <footer>© 2026 Saint Daniel · saintbuilds.com</footer>
</div>
</body>
</html>
